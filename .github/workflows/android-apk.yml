name: Android APK

on:
  push:
    branches: [main, mobile-local-v2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Sync web app into native shell
        working-directory: app
        run: node scripts/sync-www.mjs && npx cap sync android

      - name: Build debug APK (sideload)
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RHAGE-android-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
